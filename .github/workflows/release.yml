name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@3c84a702b48ef8e88b0c696e1621d4e040d3a7bb # .github main (PR #2 merged)
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      timeout-minutes: 10
