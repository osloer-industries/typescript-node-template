name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@8461a7dd37a104de2283cac3e5974026cd18777a # .github PR #2 head
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      timeout-minutes: 10
