name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@80340f8b509c4c5ecde51bff0ddb6c04e6687fdc # v0.1.4
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      release-app-owner: osloer-industries
      release-app-repositories: typescript-node-template