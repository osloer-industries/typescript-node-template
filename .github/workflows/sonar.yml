# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: SonarCloud

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-open-issues:
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@b62b0798a56e1fe7d5fd5535d59567f3d2974644 # main
    with:
      project-key: osloer-industries_typescript-node-template
      reusables-ref: b62b0798a56e1fe7d5fd5535d59567f3d2974644
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}