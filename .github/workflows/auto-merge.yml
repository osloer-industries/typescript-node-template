name: Auto-merge

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@b7de8bdeeaf4d7646d37b4d1b0ee51e4d72640eb # v0.1.10
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: squash
      allow-dependabot: true
      allow-release-prs: true