name: Auto-merge

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@d8f690b3ee555b72426099f4755e0da2f74d745f # v0.1.11
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: squash
      allow-dependabot: true
      allow-release-prs: true