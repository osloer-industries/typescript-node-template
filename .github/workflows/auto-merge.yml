name: Auto-merge

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@c445f93d7b7f55f55619226422fc493b4516bb6e # v0.1.9
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: squash
      allow-dependabot: true
      allow-release-prs: true