# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read

  guardrail-detect:
    name: Guardrail detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      guardrail_changed: ${{ steps.guardrail.outputs.guardrail_changed || steps.guardrail-skip.outputs.guardrail_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: guardrail-skip
        if: github.event_name != 'pull_request'
        run: |
          echo "guardrail_changed=false" >> "$GITHUB_OUTPUT"
          echo "No guardrail path changes detected."
      - id: guardrail
        if: github.event_name == 'pull_request'
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GUARDRAIL_HEAD_REF: HEAD
        run: node scripts/check-guardrail-changes.ts

  harness-approval:
    name: harness-approval
    needs: guardrail-detect
    if: >-
      github.event_name == 'pull_request' &&
      needs.guardrail-detect.outputs.guardrail_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harness-approval
    permissions: {}
    steps:
      - name: Record approved commit
        run: echo "Harness guardrail approval recorded for commit ${{ github.sha }}"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs --install-eslint-sonarjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix packages/eslint-sonarjs
      - run: npm run check

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs
      - name: Mutation (changed src on pull request)
        if: github.event_name == 'pull_request'
        env:
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-mutation-changed.ts
      - name: Mutation (full src on main)
        if: github.event_name == 'push'
        run: npm run test:mutation

  setup-smoke:
    name: Setup smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [plugin, mcp, npm-package, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs
      - run: npm run setup -- --scenario ${{ matrix.scenario }} --name @smoke/${{ matrix.scenario }}-template --yes

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      coverage-npm-script: coverage:sonar
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      project-key: osloer-industries_typescript-node-template
      ce-task-id: ${{ needs.sonar-analyze.outputs.ce-task-id }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  fleet-adoption-doc:
    name: Fleet adoption table sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require fleet-adoption.md when workflows change
        if: github.event_name == 'pull_request'
        env:
          FLEET_ADOPTION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-fleet-adoption-doc.ts

  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflow-security
      - guardrail-detect
      - harness-approval
      - quality
      - mutation
      - setup-smoke
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
      - fleet-adoption-doc
    if: always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require every upstream job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-passed-gate.ts
