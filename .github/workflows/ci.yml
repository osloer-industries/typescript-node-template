# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read

  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      check-npm-script: check
      fetch-depth: 0
      pr-pre-check-script: scripts/check-guardrail-changes.ts
      npm-prefixes-json: '["packages/eslint-sonarjs"]'

  mutation:
    uses: osloer-industries/.github/.github/workflows/mutation-changed.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6

  setup-smoke:
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      timeout-minutes: 15

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      coverage-npm-script: coverage:sonar
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      project-key: osloer-industries_typescript-node-template
      ce-task-id: ${{ needs.sonar-analyze.outputs.ce-task-id }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  fleet-adoption-doc:
    name: Fleet adoption table sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require fleet-adoption.md when workflows change
        if: github.event_name == 'pull_request'
        env:
          FLEET_ADOPTION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-fleet-adoption-doc.ts

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - quality
      - mutation
      - setup-smoke
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
      - fleet-adoption-doc
    if: always()
    uses: osloer-industries/.github/.github/workflows/ci-passed.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      needs-json: ${{ toJSON(needs) }}