# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d1fd7700ad30c0bafbe1d0e4b1eac1fbbb4137b3 # v0.1.2
    permissions:
      contents: read
      actions: read

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/npm-workspace
        with:
          fetch-depth: 0
          install-eslint-sonarjs: true
      - name: Guardrail path change notice
        if: github.event_name == 'pull_request'
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-guardrail-changes.ts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix packages/eslint-sonarjs
      - run: npm run check

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/npm-workspace
        with:
          fetch-depth: 0
      - name: Mutation (changed src on pull request)
        if: github.event_name == 'pull_request'
        env:
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-mutation-changed.ts
      - name: Mutation (full src on main)
        if: github.event_name == 'push'
        run: npm run test:mutation

  setup-smoke:
    name: Setup smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [plugin, mcp, npm-package, cli]
    steps:
      - uses: ./.github/actions/npm-workspace
      - run: npm run setup -- --scenario ${{ matrix.scenario }} --name @smoke/${{ matrix.scenario }}-template --yes
