# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-paths-scope:
    uses: osloer-industries/.github/.github/workflows/ci-paths-scope.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9

  workflow-security:
    needs: ci-paths-scope
    if: |
      always() && needs.ci-paths-scope.outputs.run-full-ci == 'true' &&
      needs.ci-paths-scope.outputs.workflows-changed == 'true'
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    permissions:
      contents: read
      actions: read

  quality:
    needs: ci-paths-scope
    if: needs.ci-paths-scope.outputs.run-full-ci == 'true'
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    with:
      check-npm-script: precommit
      fetch-depth: 0
      pr-pre-check-script: scripts/check-guardrail-changes.ts
      npm-prefixes-json: '["packages/eslint-sonarjs"]'

  mutation:
    needs: ci-paths-scope
    if: needs.ci-paths-scope.outputs.run-full-ci == 'true'
    uses: osloer-industries/.github/.github/workflows/mutation-changed.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9

  setup-smoke:
    needs: ci-paths-scope
    if: needs.ci-paths-scope.outputs.run-full-ci == 'true'
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    with:
      timeout-minutes: 15

  journey-e2e:
    name: Journey e2e
    needs: ci-paths-scope
    if: needs.ci-paths-scope.outputs.run-full-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs --install-eslint-sonarjs
      - run: npm run test:e2e

  codeql:
    needs: ci-paths-scope
    if: |
      needs.ci-paths-scope.outputs.run-full-ci == 'true' &&
      (
        github.event_name != 'pull_request' ||
        needs.ci-paths-scope.outputs.run-codeql == 'true'
      )
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    needs: ci-paths-scope
    if: |
      needs.ci-paths-scope.outputs.run-full-ci == 'true' &&
      needs.ci-paths-scope.outputs.product-code-changed == 'true'
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    with:
      coverage-npm-script: coverage:sonar
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: |
      github.event_name == 'pull_request' &&
      needs.ci-paths-scope.outputs.run-full-ci == 'true' &&
      needs.ci-paths-scope.outputs.product-code-changed == 'true'
    needs:
      - ci-paths-scope
      - sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
    with:
      project-key: osloer-industries_typescript-node-template
      ce-task-id: ${{ needs.sonar-analyze.outputs.ce-task-id }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  fleet-adoption-doc:
    name: Fleet adoption table sync
    needs: ci-paths-scope
    if: |
      github.event_name == 'pull_request' &&
      needs.ci-paths-scope.outputs.workflows-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require fleet-adoption.md when workflows change
        env:
          FLEET_ADOPTION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-fleet-adoption-doc.ts

  ci-passed:
    name: ci-passed
    needs:
      - ci-paths-scope
      - workflow-security
      - quality
      - mutation
      - setup-smoke
      - journey-e2e
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
      - fleet-adoption-doc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: osloer-industries/.github/.github/actions/ci-passed-gate@d35742865fee88749fa3efb6cf657b012598584e # v0.1.9
        with:
          needs-json: ${{ toJSON(needs) }}
          github-event-name: ${{ github.event_name }}