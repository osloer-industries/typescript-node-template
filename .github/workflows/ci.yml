name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@3c84a702b48ef8e88b0c696e1621d4e040d3a7bb # .github main (PR #2 merged)
    with:
      node-version-file: .nvmrc
      check-npm-script: check
      npm-ci-ignore-scripts: true
      audit-level: high
      npm-prefixes-json: '["packages/eslint-sonarjs"]'
      job-name: Quality
      timeout-minutes: 10

  setup-smoke:
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@3c84a702b48ef8e88b0c696e1621d4e040d3a7bb # .github main (PR #2 merged)
    with:
      scenarios-json: '["plugin","mcp","npm-package","cli"]'
      setup-npm-script: setup
      smoke-name-prefix: "@smoke/"
      node-version-file: .nvmrc
      timeout-minutes: 15
