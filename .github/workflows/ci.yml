# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d1fd7700ad30c0bafbe1d0e4b1eac1fbbb4137b3 # v0.1.2
    permissions:
      contents: read
      actions: read

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository (quality)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Node.js (quality)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs --install-eslint-sonarjs
      - name: Guardrail path change notice
        if: github.event_name == 'pull_request'
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-guardrail-changes.ts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix packages/eslint-sonarjs
      - run: npm run check

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository (mutation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Node.js (mutation)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs
      - name: Mutation (changed src on pull request)
        if: github.event_name == 'pull_request'
        env:
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-mutation-changed.ts
      - name: Mutation (full src on main)
        if: github.event_name == 'push'
        run: npm run test:mutation

  setup-smoke:
    name: Setup smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [plugin, mcp, npm-package, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs
      - run: npm run setup -- --scenario ${{ matrix.scenario }} --name @smoke/${{ matrix.scenario }}-template --yes

  journey-e2e:
    name: Journey e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs --install-eslint-sonarjs
      - run: npm run test:e2e

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@d1fd7700ad30c0bafbe1d0e4b1eac1fbbb4137b3 # v0.1.2
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@d1fd7700ad30c0bafbe1d0e4b1eac1fbbb4137b3 # v0.1.2
    permissions:
      contents: read
    with:
      coverage-npm-script: coverage:sonar
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@d1fd7700ad30c0bafbe1d0e4b1eac1fbbb4137b3 # v0.1.2
    permissions:
      contents: read
      pull-requests: read
    with:
      project-key: osloer-industries_typescript-node-template
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  fleet-adoption-doc:
    name: Fleet adoption table sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require fleet-adoption.md when workflows change
        if: github.event_name == 'pull_request'
        env:
          FLEET_ADOPTION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-fleet-adoption-doc.ts

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - quality
      - mutation
      - setup-smoke
      - journey-e2e
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
      - fleet-adoption-doc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require every upstream job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-passed-gate.ts