# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d4865a4b2c70c8433188f5200beac104b1c7fe86 # main
    permissions:
      contents: read
      actions: read

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/eslint-sonarjs
      - name: Guardrail path change notice
        if: github.event_name == 'pull_request'
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-guardrail-changes.ts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix packages/eslint-sonarjs
      - run: npm run check

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Mutation (changed src on pull request)
        if: github.event_name == 'pull_request'
        env:
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-mutation-changed.ts
      - name: Mutation (full src on main)
        if: github.event_name == 'push'
        run: npm run test:mutation

  setup-smoke:
    name: Setup smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [plugin, mcp, npm-package, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run setup -- --scenario ${{ matrix.scenario }} --name @smoke/${{ matrix.scenario }}-template --yes
