# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      contents: read
      actions: read

  guardrail-detect:
    name: Guardrail detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      guardrail_changed: ${{ steps.guardrail.outputs.guardrail_changed || steps.guardrail-skip.outputs.guardrail_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: guardrail-skip
        if: github.event_name != 'pull_request'
        run: |
          echo "guardrail_changed=false" >> "$GITHUB_OUTPUT"
          echo "No guardrail path changes detected."
      - id: guardrail
        if: github.event_name == 'pull_request'
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GUARDRAIL_HEAD_REF: HEAD
        run: node scripts/check-guardrail-changes.ts

  harness-approval:
    name: harness-approval
    needs: guardrail-detect
    if: always() && needs.guardrail-detect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: >-
      ${{ needs.guardrail-detect.outputs.guardrail_changed == 'true'
      && 'harness-approval' }}
    permissions: {}
    steps:
      - name: Waive harness approval when guardrails unchanged
        if: needs.guardrail-detect.outputs.guardrail_changed != 'true'
        run: echo "No harness path changes; approval not required."
      - name: Record approved commit
        if: needs.guardrail-detect.outputs.guardrail_changed == 'true'
        run: echo "Harness guardrail approval recorded for commit ${{ github.sha }}"

  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      check-npm-script: precommit
      fetch-depth: 0
      npm-prefixes-json: '["packages/eslint-sonarjs"]'

  mutation:
    uses: osloer-industries/.github/.github/workflows/mutation-changed.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7

  setup-smoke:
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      timeout-minutes: 15

  journey-e2e:
    name: Journey e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node scripts/ci-npm-workspace.mjs --install-eslint-sonarjs
      - run: npm run test:e2e

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      coverage-npm-script: coverage:sonar
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      project-key: osloer-industries_typescript-node-template
      ce-task-id: ${{ needs.sonar-analyze.outputs.ce-task-id }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  fleet-adoption-doc:
    name: Fleet adoption table sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Require fleet-adoption.md when workflows change
        if: github.event_name == 'pull_request'
        env:
          FLEET_ADOPTION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-fleet-adoption-doc.ts

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - guardrail-detect
      - harness-approval
      - quality
      - mutation
      - setup-smoke
      - journey-e2e
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
      - fleet-adoption-doc
    if: always()
    uses: osloer-industries/.github/.github/workflows/ci-passed.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      needs-json: ${{ toJSON(needs) }}
