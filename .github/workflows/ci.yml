name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@723d26a795c2cfc7022471bc956cc5a99a9d14cf # .github PR #2 head
    with:
      node-version-file: .nvmrc
      check-command: npm run check
      npm-ci-ignore-scripts: true
      audit-level: high
      npm-prefixes-json: '["packages/eslint-sonarjs"]'
      job-name: Quality
      timeout-minutes: 10

  setup-smoke:
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@723d26a795c2cfc7022471bc956cc5a99a9d14cf # .github PR #2 head
    with:
      scenarios-json: '["plugin","mcp","npm-package","cli"]'
      setup-command: npm run setup -- --scenario {scenario} --name @smoke/{scenario}-template --yes
      node-version-file: .nvmrc
      timeout-minutes: 15
