name: Pull request title

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    uses: osloer-industries/.github/.github/workflows/semantic-pull-request.yml@618f33feb09deee59aa06b92fc203f162e73370a # v0.1.9
    permissions:
      pull-requests: read