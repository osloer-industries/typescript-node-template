name: Pull request title

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    uses: osloer-industries/.github/.github/workflows/semantic-pull-request.yml@1a4e4c8d7d8c0e532d32240d53d81f2a52f47bb6 # v0.1.9
    permissions:
      pull-requests: read