name: Pull request title

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    uses: osloer-industries/.github/.github/workflows/semantic-pull-request.yml@76aab6abfeeb4f8991f9ce83de1b9bd24abcf534 # v0.1.9
    permissions:
      pull-requests: read