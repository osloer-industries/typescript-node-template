name: Pull request title

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    uses: osloer-industries/.github/.github/workflows/semantic-pull-request.yml@c6669a6c5705d05149d34928e231cb37a06fc862 # v0.1.9
    permissions:
      pull-requests: read