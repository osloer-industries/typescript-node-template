name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@723d26a795c2cfc7022471bc956cc5a99a9d14cf # .github PR #2 head
    with:
      fail-on-severity: high
      timeout-minutes: 5
