name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@8461a7dd37a104de2283cac3e5974026cd18777a # .github PR #2 head
    with:
      fail-on-severity: high
      timeout-minutes: 5
