# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: Dependency review
on:
  pull_request:
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@1a4e4c8d7d8c0e532d32240d53d81f2a52f47bb6 # v0.1.9