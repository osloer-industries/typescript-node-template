# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: Dependency review
on:
  pull_request:
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@c445f93d7b7f55f55619226422fc493b4516bb6e # v0.1.9