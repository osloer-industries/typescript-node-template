# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: Dependency review
on:
  pull_request:
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@d8f690b3ee555b72426099f4755e0da2f74d745f # v0.1.11