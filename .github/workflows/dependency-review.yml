# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
name: Dependency review
on:
  pull_request:
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: osloer-industries/.github/.github/workflows/dependency-review.yml@962e9cfd1567c7ea3b31ff704a17961d0a6afc17 # v0.1.9