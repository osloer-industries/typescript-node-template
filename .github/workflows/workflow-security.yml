# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md); org gate ADR 0004
name: Workflow security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@43cd5bb5596d8f80c73537bd3dab29b4d8a95ade # main
    permissions:
      contents: read
      actions: read
