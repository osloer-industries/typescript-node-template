# Tooling rationale: ADR 0009 (docs/adr/0009-tooling-and-quality-gate-stack.md)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/eslint-sonarjs
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
