version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/eslint-sonarjs
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @typescript-eslint/parser peer range is typescript <6.1.0 until TS 7.1 ships a
      # programmatic API and typescript-eslint adds support (see docs/sonar-quality-gate.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
