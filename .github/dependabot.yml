version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Keeps direct markdownlint-cli2 bumps from fanning out into separate multi-PRs for the same
      # transitive majors (markdown-it 15, js-yaml 5) when those land together.
      markdownlint-cli2:
        patterns:
          - "markdownlint-cli2"
          - "markdown-it"
          - "js-yaml"
        update-types: [minor, patch, major]
  - package-ecosystem: npm
    directory: /packages/eslint-sonarjs
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @typescript-eslint/parser peer range is typescript <6.1.0 until TS 7.1 ships a
      # programmatic API and typescript-eslint adds support (see docs/sonar-quality-gate.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Berlin }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: [minor, patch]
