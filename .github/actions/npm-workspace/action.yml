name: npm workspace bootstrap
description: Checkout, setup Node from .nvmrc, and npm ci
inputs:
  fetch-depth:
    description: checkout fetch-depth (0 = full history for git-based scripts)
    required: false
    default: "1"
  install-eslint-sonarjs:
    description: also npm ci in packages/eslint-sonarjs
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci --ignore-scripts
      shell: bash
    - if: inputs.install-eslint-sonarjs == 'true'
      run: npm ci --ignore-scripts --prefix packages/eslint-sonarjs
      shell: bash