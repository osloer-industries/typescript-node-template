# Replace both placeholders before enabling the SonarQube Cloud workflow.
sonar.organization=YOUR_SONAR_ORGANIZATION
sonar.projectKey=YOUR_SONAR_PROJECT_KEY
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,scripts/**/*.test.mjs
sonar.exclusions=src/**/*.test.ts,src/**/*.spec.ts,scripts/**/*.test.mjs,scripts/setup.mjs,dist/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
