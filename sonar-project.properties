# Replace both placeholders before enabling the SonarQube Cloud workflow.
sonar.organization=YOUR_SONAR_ORGANIZATION
sonar.projectKey=YOUR_SONAR_PROJECT_KEY
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.spec.ts,dist/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
