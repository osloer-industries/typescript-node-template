# Forks: replace organization and projectKey before enabling the SonarQube Cloud workflow.
sonar.organization=osloer-industries
sonar.projectKey=osloer-industries_typescript-node-template
sonar.sources=src,scripts,packages
sonar.tests=src,scripts,packages
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,scripts/**/*.test.mjs,scripts/**/*.test.ts,packages/**/*.test.mjs
sonar.exclusions=src/**/*.test.ts,src/**/*.spec.ts,scripts/**/*.test.mjs,scripts/**/*.test.ts,scripts/setup.mjs,packages/**/*.test.mjs,dist/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
